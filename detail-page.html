<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="detail-page.css">
</head>
<body>
    <header class="header">
        <!--Blue line-->
        <div class="bg-class-info">
            <div class="contact-info">
                <!--City-->
                <div class="city">
                    <img class="map-icon" src="assets/map-icon.png" alt="">
                    <div class="city-text">
                        <p class="city-text-p">
                            Kirim ke: Jakarta Selatan
                        </p>
                    </div>
                </div>
                <!--More Info-->
                <div class="more-info">
                    <div class="contact">
                        <p>
                            📞 0800-1234-5678 (Gratis)
                        </p>
                    </div>
                    <div class="free">
                        <p>
                            🚀 Gratis ongkir di atas Rp 100.000
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!--Beli Mudah-->
        <div class="beli-mudah">
            <!--Logo-->
             <div class="logo-b">
                <p class="logo">
                    B
                </p>
             </div>

             <!--Beli Mudah-->
             <div class="beli-mudah-text">
                <p class="beli-mudah-p">
                    Beli Mudah
                </p>
             </div>

             <!--form-->
            <div class="container-form">
                <form class="form">
                    <input class="input-form" placeholder="Cari produk, merek, kategori...">
                    <button class="button-form">
                        <img class="search-icon" src="assets/search-icon.png" alt="search-icon">
                    </button>
                </form>
            </div>

            <!--container-3-->
            <div class="menu-container">
                <div class="bell-container">
                    <img class="bell-icon" src="assets/bell-icon.png" alt="">
                </div>

                <div class="profile">
                    <img class="profile-icon" src="assets/profile-icon.png" alt="">
                    <div class="name-text-container">
                        <p class="name-text">
                            Budi
                        </p>
                    </div>
                </div>

                <div class="love-container">
                    <img class="love-icon" src="assets/love-icon.png" alt="">
                </div>

                <div class="cart-container">
                    <img class="cart-icon" src="assets/cart-icon.png" alt="">
                </div>
            </div>
        </div>

        <nav>
            <div class="navbar-container">
                <div class="category-container">
                    <img class="humberger-icon" src="assets/humberger-icon.png" alt="">
                    <div class="category-text-container">    
                        <span class="category-text"> Semua Kategori </span>
                    </div>
                    <img class="arrow-icon" src="assets/bottom-arrow.png" alt="">
                </div>

                <div class="electronic-container">
                    <div class="electronic-icon-container">
                        <span class="electronic-icon-span">💻</span>
                    </div>    
                    <div class="electronic-text-container">
                        <span class="electronic-text"> Elektronik </span>
                    </div>
                </div>

                <div class="electronic-container">
                    <div class="electronic-icon-container">
                        <span class="electronic-icon-span">👗</span>
                    </div>    
                    <div class="electronic-text-container">
                        <span class="electronic-text"> Fashion </span>
                    </div>
                </div>

                <div class="electronic-container">
                    <div class="electronic-icon-container">
                        <span class="electronic-icon-span">🏠</span>
                    </div>    
                    <div class="electronic-text-container">
                        <span class="electronic-text"> Rumah & Dapur </span>
                    </div>
                </div>

                <div class="electronic-container">
                    <div class="electronic-icon-container">
                        <span class="electronic-icon-span">💄</span>
                    </div>    
                    <div class="electronic-text-container">
                        <span class="electronic-text"> Kecantikan </span>
                    </div>
                </div>

                <div class="electronic-container">
                    <div class="electronic-icon-container">
                        <span class="electronic-icon-span">⚽</span>
                    </div>    
                    <div class="electronic-text-container">
                        <span class="electronic-text"> Olahraga </span>
                    </div>
                </div>

                <div class="electronic-container">
                    <div class="electronic-icon-container">
                        <span class="electronic-icon-span">📚</span>
                    </div>    
                    <div class="electronic-text-container">
                        <span class="electronic-text"> Buku & Alat Tulis </span>
                    </div>
                </div>

                <div class="electronic-container">
                    <div class="electronic-text-container">
                        <span class="electronic-text"> 🔥 Promo </span>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
